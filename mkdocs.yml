# The documentation site: uv sync --group docs && uv run mkdocs serve   (build: uv run mkdocs build --strict)
# README, CHANGELOG, ROADMAP and the examples / gallery indexes are pulled in, and the guide is split into one page per
# chapter, placed in the part (Using solvi / Building blocks / Experimental) its contents name, by tools/mkdocs_hooks.py;
# the Markdown files themselves stay as they read on GitHub.
site_name: solvi
site_description: Decision systems from a catalog of Python functions and checks, with answers you can verify
site_url: https://solvi-ai.github.io/solvi/
repo_url: https://github.com/solvi-ai/solvi
repo_name: solvi-ai/solvi
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
exclude_docs: |
  images/ALT.md

hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Mission: mission.md
  - Using solvi:
      - using.md
      - Agents and knowledge: agent.md
      - Best practices: best_practices.md
      - Forgetting a source: forgetting_a_source.md
      - Guide: guide-part:Using solvi        # the guide's chapters of this part, one page each (tools/mkdocs_hooks.py)
      - Regression tests: testing.md
      - Honesty suite: honesty.md
  - Building blocks:
      - building_blocks.md
      - Guide: guide-part:Building blocks
      - Decider checkpoint and input format: decide_format.md
      - Stored decisions, format and replay rules: trace_spec.md
      - Code strategist: strategist.md
  - Experimental:
      - experimental.md
      - Guide: guide-part:Experimental
  - Evidence:
      - Benchmarks: benchmarks.md
      - solvi vs asking an LLM: vs_llm.md
  - Examples:

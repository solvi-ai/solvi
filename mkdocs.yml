# The documentation site: uv sync --group docs && uv run mkdocs serve   (build: uv run mkdocs build --strict)
# README, CHANGELOG, ROADMAP and the examples / gallery indexes are pulled in, and the guide is split into one page per
# chapter, by tools/mkdocs_hooks.py; the Markdown files themselves stay as they read on GitHub.
site_name: solvi
site_description: Decision systems from a catalog of Python functions and checks, with answers you can verify
site_url: https://solvi-ai.github.io/solvi/
repo_url: https://github.com/solvi-ai/solvi
repo_name: solvi-ai/solvi
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
exclude_docs: |
  images/ALT.md

hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Mission: mission.md
  - Guide: guide/index.md          # expanded into one page per chapter by the hook
  - Best practices: best_practices.md
  - Formats and tools:
      - Decider checkpoint and input format: decide_format.md
      - Code strategist: strategist.md
      - Regression tests: testing.md
      - Honesty suite: honesty.md
      - Benchmarks: benchmarks.md
      - solvi vs asking an LLM: vs_llm.md
  - Examples:
      - Examples: examples.md
      - Gallery: gallery.md
  - API reference:
      - api/index.md
      - solvi: api/solvi.md
      - solvi.core: api/core.md
      - solvi.core.deciders: api/decide.md
      - solvi.core.calibration: api/calibration.md
      - solvi.core.guarantees.guarantee: api/guarantee.md
      - solvi.core.guarantees.openset: api/openset.md
      - solvi.core.deciders.systemone: api/systemone.md
      - solvi.core.deciders.llm: api/llm.md
      - solvi.core.deciders._remote: api/remote.md
      - solvi.core.slow.generate: api/generate.md
      - solvi.core.slow.agree: api/agree.md
      - solvi.core.slow.refine: api/refine.md
      - solvi.experimental.compile: api/compile.md
      - solvi.experimental.compile.sandbox: api/sandbox.md
      - solvi.core.deciders.combine: api/multi.md
      - solvi.core.knowledge.memory: api/memory.md
      - solvi.experimental.lora: api/lora.md
      - solvi.experimental.learning: api/learning.md
      - solvi.experimental.oncalib: api/oncalib.md
      - solvi.serve: api/serve.md
      - solvi.agents: api/agents.md
      - solvi.experimental.hooks: api/hooks.md
      - solvi.core.textin: api/textin.md
      - solvi.core._inputs: api/inputs.md
      - solvi.experimental.specialist: api/specialist.md
      - solvi.experimental.charts: api/charts.md
      - solvi.core.deciders.longdoc: api/longdoc.md
      - solvi.core.knowledge.episodes: api/episode.md
      - solvi.core.knowledge.worldmap: api/worldmap.md
      - solvi.core.guarantees.drift: api/drift.md
      - solvi.core.deciders.heads: api/heads.md
      - solvi.core.extract: api/extract_long.md
      - solvi.core.extract.multi: api/extract_multi.md
      - solvi.core.plan.strategist: api/strategist.md
      - solvi.core.plan.cost: api/strategy.md
      - solvi.core.costs: api/costs.md
      - solvi.core.deciders.rulelist: api/rulelist.md
      - solvi.core.store.audit: api/audit.md
      - solvi.show: api/show.md
      - solvi.core.store.report: api/report.md
      - solvi.core.store.sysreport: api/sysreport.md
      - solvi.core.sets: api/sets.md
      - solvi.core.slow.search: api/search.md
      - solvi.auto: api/auto.md
      - solvi.core.dispatch: api/dispatch.md
      - solvi.experimental.counterfactual: api/counterfactual.md
      - solvi.core.deciders.perturb: api/perturb.md
      - solvi.core.store: api/storage.md
      - solvi.core.store.signature: api/signature.md
      - solvi.core.store.diff: api/diff.md
      - solvi.testing: api/testing.md
      - solvi.honesty: api/honesty.md
      - solvi.check: api/check.md
      - solvi.core.calibfile: api/calibfile.md
      - solvi.models: api/models.md
      - solvi.scaffold: api/scaffold.md
      - solvi.core._i18n: api/i18n.md
  - Changelog: changelog.md
  - Roadmap: roadmap.md

markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            members_order: source
            filters: public
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

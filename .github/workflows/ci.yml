name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest -q
      - name: honesty gate (docs/honesty.md)
        run: uv run python -m solvi.honesty tests/honesty/core_v1.json --baseline tests/honesty/core_v1.baseline.json
      - name: gallery cases as regression tests (docs/testing.md)
        run: uv run solvi test gallery/ -q
      - name: gallery catalogs pass solvi check (no errors)
        run: |
          for d in gallery/[0-9]*/; do echo "== $d"; uv run solvi check "$d" > /dev/null || { uv run solvi check "$d"; exit 1; }; done
      - name: run the gallery
        run: |
          for f in gallery/*/run.py; do echo "== $f"; uv run python "$f" > /dev/null; done
      - name: run core examples
        run: |
          for f in examples/0[1-69]_*.py examples/1[0-7]_*.py examples/19_*.py examples/23_*.py; do echo "== $f"; uv run python "$f" > /dev/null; done
      - name: agent frameworks (solvi.agents adapters)
        if: matrix.python == '3.12'
        run: |
          uv sync --group dev --group agents
          uv run pytest -q tests/test_agents*.py
      - name: LoRA adapters (part.adapt_lora, CPU torch), long texts with a real tokenizer (long="full", torch and ONNX)
        if: matrix.python == '3.12'
        run: |
          uv sync --group dev --group lora
          uv run --with onnx --with onnxruntime pytest -q tests/test_lora.py tests/test_long_tokenizer.py tests/test_long_full.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: ruff (pyproject.toml [tool.ruff])
        run: uvx ruff@0.16.9 check
      - name: pyright, basic mode, on src/solvi (pyproject.toml [tool.pyright])
        run: uvx pyright@1.1.414 --pythonpath .venv/bin/python
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build

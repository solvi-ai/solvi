name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest -q
      - name: run the gallery
        run: |
          for f in gallery/*/run.py; do echo "== $f"; uv run python "$f" > /dev/null; done
      - name: run core examples
        run: |
          for f in examples/0[1-69]_*.py examples/10_*.py; do echo "== $f"; uv run python "$f" > /dev/null; done
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build

[project]
name = "solvi"
version = "0.2.0"
description = "Decision systems from a catalog of Python functions and checks: a strategist plans the flow, every answer comes with a quote or formula and a verifiable trace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["decision systems", "rules", "document extraction", "ModernBERT", "explainability", "verification", "audit trail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
authors = [
    { name = "mxkuzn", email = "hi@mxkuzn.dev" }
]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
model = ["torch", "transformers"]   # model-based extraction from text (solvi.extract_*)

[project.urls]
Homepage = "https://github.com/solvi-ai/solvi"
Documentation = "https://github.com/solvi-ai/solvi/blob/main/docs/guide.md"
Issues = "https://github.com/solvi-ai/solvi/issues"
Models = "https://huggingface.co/solvi-ai"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

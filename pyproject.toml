[project]
name = "solvi"
version = "0.7.2.dev0"
description = "Decision systems from a catalog of Python functions and checks: a strategist plans the flow, every answer comes with a quote or formula and a verifiable trace"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["decision systems", "rules", "document extraction", "ModernBERT", "explainability", "verification", "audit trail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
authors = [
    { name = "mxkuzn", email = "hi@mxkuzn.dev" }
]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pydantic>=2", "tomli>=1.1; python_version < '3.11'"]   # tomli: rules files (solvi hook) on 3.10

[project.optional-dependencies]
model = ["torch", "transformers"]   # model-based extraction from text (solvi.extract_*), the decider (solvi.decide), the model strategist and name matcher (solvi.strategy_model, solvi.aliases) — torch backends
onnx = ["onnxruntime", "tokenizers", "huggingface_hub"]   # the decider, the model strategist and the name matcher without torch (backend="onnx")
serve = ["fastapi>=0.100", "uvicorn"]   # solvi serve: the questions over HTTP, POST /v1/systemone
mcp = ["mcp>=2"]   # solvi serve --mcp with the official MCP SDK (without it: a built-in stdio server)
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]   # solvi.otel.export: traces as OpenTelemetry spans (without it: to_otlp_json)
duckdb = ["duckdb>=1.0"]   # solvi.DuckDBStorage: decisions in a DuckDB file (analytics next to JSONL / Parquet)
postgres = ["psycopg>=3.1"]   # solvi.PostgresStorage: decisions in PostgreSQL, several services writing
pydantic-ai = ["pydantic-ai-slim>=1.0"]   # solvi.agents.pydantic_ai: GuardedToolset (tested with pydantic-ai 2.51)
langgraph = ["langgraph>=1.0"]   # solvi.agents.langgraph: a guarded ToolNode (tested with langgraph 1.2.12, langchain-core 1.6.5)
openai-agents = ["openai-agents>=0.22"]   # solvi.agents.openai_agents: a tool input guardrail (tested with openai-agents 0.22.3)
lora = ["torch", "transformers", "peft>=0.13"]   # part.adapt_lora (experimental): a LoRA adapter on the decider for one question (torch backend)

[project.scripts]
solvi = "solvi.cli:main"

[project.entry-points.pytest11]
solvi = "solvi.pytest_plugin"

[project.urls]
Homepage = "https://github.com/solvi-ai/solvi"
Documentation = "https://solvi-ai.github.io/solvi/"
Issues = "https://github.com/solvi-ai/solvi/issues"
Models = "https://huggingface.co/solvi-ai"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.141.1", "uvicorn>=0.54.0", "mcp>=2.2.0", "httpx2>=2.13.1", "opentelemetry-sdk>=1.20",
       "duckdb>=1.0"]   # httpx2: FastAPI's TestClient; duckdb: DuckDBStorage's tests
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]   # the documentation site: uv run mkdocs serve
agents = ["pydantic-ai-slim>=1.0", "langgraph>=1.0", "openai-agents>=0.22"]   # solvi.agents adapters: tests/test_agents_frameworks.py
lora = ["torch", "transformers", "peft>=0.13"]   # part.adapt_lora: tests/test_lora.py (skipped without them; torch is too big for the dev group)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a real model checkpoint and its runtime (skipped when they are missing)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["spaces"]          # the Hugging Face Space apps: deployed on their own, with their own requirements

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, blind excepts (the code marks the deliberate ones: `# noqa: BLE001`) and bandit's security
# checks. Not enforced: the line length (long lines are the house style, not a bug) and the formatting.
select = ["E", "F", "W", "B", "BLE", "S"]
ignore = [
    "E501",    # line length: not reformatting the code base
    "E731",    # a lambda bound to a name, where a def would only add lines
    "B007",    # unused names in a tuple unpacking in a loop: they document the shape of the items
    "B023",    # closures over a loop variable that are called within the same iteration (timeit, generator steps)
    "B905",    # zip() without strict=: solvi zips sequences of equal length by construction
    "S101",    # assert: tests and invariants
    "S311",    # random: sampling and shuffling, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E741"]            # tests exec catalog sources, start subprocesses and use fake secrets
"benchmarks/**" = ["S"]
"examples/**" = ["S"]
"gallery/**" = ["S"]
"tools/**" = ["S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body"]

[tool.pyright]
include = ["src/solvi"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"      # the optional extras (torch, transformers, onnxruntime, mcp, ...) may be missing
reportMissingModuleSource = "none"
# solvi is a dynamically typed code base: `x: T = None` defaults, facts and records typed `object` / `Any`, attributes set
# on instances (a Response's System, a loaded model's files) and dicts of mixed values. These rules report that style
# (about 260 findings on 0.7, none of them a bug on review) — shown as warnings, not failures; the rest of basic mode
# (undefined and possibly unbound names, bad imports of solvi's own modules, call arity, return types, ...) fails CI.
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalIterable = "none"
reportOptionalOperand = "none"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportIndexIssue = "warning"
reportGeneralTypeIssues = "warning"
reportAssignmentType = "warning"
reportOperatorIssue = "warning"
reportRedeclaration = "warning"
